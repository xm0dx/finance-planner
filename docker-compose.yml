name: finance-planner

services:
  # Python persistence API (standard library only).
  backend:
    build: .
    restart: unless-stopped
    volumes:
      - data:/data

  # nginx serves the SPA and proxies /api/ to the backend on one origin.
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./app:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  data:
