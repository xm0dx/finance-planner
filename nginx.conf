# Serves the single-page app and proxies the persistence API on the SAME origin,
# so the browser's /api/state calls need no CORS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Trailing slash strips the prefix: /api/state -> backend:8000/state
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        client_max_body_size 6m;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
